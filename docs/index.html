
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Component Recognizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>🔌 Electronic Component Recognizer</h1>
        <p class="subtitle">Upload an image of an electronic component to identify it instantly.</p>

        <div class="card">
            <input type="file" id="fileInput" accept="image/*" class="file-input">
            <img id="preview" class="preview" style="display:none;">
            <button id="predictBtn">⚡ Predict</button>
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');
        let selectedFile = null;

        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = ev => {
                preview.src = ev.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('predictBtn').addEventListener('click', async () => {
            if (!selectedFile) { alert("Please upload an image first!"); return; }

            const formData = new FormData();
            formData.append("image", selectedFile);

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) throw new Error("Server returned " + response.status);

                const data = await response.json();

                if (!data || data.length === 0) {
                    resultDiv.innerText = "No prediction returned.";
                    return;
                }

                const label = data[0].label;
                const confidences = data[0].confidences;
                let confText = "";
                confidences.forEach(c => {
                    confText += `${c.label}: ${(c.confidence * 100).toFixed(2)}%\n`;
                });

                resultDiv.innerHTML = `<p>Result: <span class="highlight">${label}</span></p>`
            } catch (err) {
                console.error(err);
                resultDiv.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>

</html>
