<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Component Recognizer</title>
</head>

<body>
    <h1>Electronic Component Recognizer</h1>
    <p>Upload an image of an electronic component to get the top predictions.</p>

    <input id="photo" type="file" accept="image/*">
    <div id="results"></div>

    <script>
        async function loaded(base64Image) {
            // Call the Hugging Face Space API
            const response = await fetch("https://mdfaisalahmed025-electronic-component-recognizer.hf.space/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ data: [base64Image] })
            });

            if (!response.ok) {
                document.getElementById("results").innerHTML = `<p style="color:red;">Server error: ${response.status} ${response.statusText}</p>`;
                return;
            }

            const json = await response.json();
            console.log("API Response:", json);

            let predictions = [];
            if (json.data && json.data[0]) {
                predictions = json.data[0]; // usually an array of {label, confidence}
            }

            // Keep top 3 predictions
            predictions = predictions.slice(0, 3);

            let html = `
                <br/>
                <img src="${base64Image}" width="500">
                <h3>Top Predictions:</h3>
                <ul>
            `;
            predictions.forEach(p => {
                html += `<li>${p.label} — ${(p.confidence * 100).toFixed(2)}%</li>`;
            });
            html += `</ul>`;

            document.getElementById("results").innerHTML = html;
        }

        function read() {
            const reader = new FileReader();
            reader.onload = () => loaded(reader.result);
            reader.readAsDataURL(document.getElementById("photo").files[0]);
        }

        document.getElementById("photo").addEventListener("input", read);
    </script>
</body>

</html>
